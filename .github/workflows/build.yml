name: Build Signed APK for RuStore

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses Directly
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$ANDROID_HOME/licenses/intel-android-extra-license"

      - name: Install Icon Tools (librsvg & Pillow)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y librsvg2-bin python3-pil

      - name: Create Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/oiltycoon/magnate
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          cp index.html app/src/main/assets/index.html

      - name: Generate App Icon (Oil Rig + Ruble Coin + Clicking Hand)
        run: |
          cat << 'EOF' > icon_generated.svg
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
            <defs>
              <radialGradient id="bgGrad" cx="50%" cy="48%" r="70%">
                <stop offset="0%" stop-color="#56B4FF"/>
                <stop offset="55%" stop-color="#2575FC"/>
                <stop offset="100%" stop-color="#123C84"/>
              </radialGradient>
              <radialGradient id="circleGlow" cx="50%" cy="50%" r="50%">
                <stop offset="65%" stop-color="#00E5FF" stop-opacity="0.55"/>
                <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
              </radialGradient>
              <linearGradient id="innerCircle" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#E6F4FF"/>
                <stop offset="100%" stop-color="#BCE0FD"/>
              </linearGradient>
              <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFF078"/>
                <stop offset="50%" stop-color="#FBBF24"/>
                <stop offset="100%" stop-color="#D97706"/>
              </linearGradient>
              <linearGradient id="oilDrop" x1="25%" y1="15%" x2="85%" y2="90%">
                <stop offset="0%" stop-color="#475569"/>
                <stop offset="45%" stop-color="#1E293B"/>
                <stop offset="100%" stop-color="#090D16"/>
              </linearGradient>
              <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#FF944D"/>
                <stop offset="100%" stop-color="#F96302"/>
              </linearGradient>
            </defs>

            <!-- Background -->
            <rect width="512" height="512" fill="url(#bgGrad)"/>

            <!-- Subtle Background Facets -->
            <polygon points="0,0 180,0 90,140" fill="#FFFFFF" opacity="0.05"/>
            <polygon points="512,0 340,0 440,170" fill="#FFFFFF" opacity="0.06"/>
            <polygon points="512,512 360,420 512,260" fill="#000000" opacity="0.08"/>

            <!-- Background Sparkles -->
            <circle cx="84" cy="36" r="3" fill="#FFFFFF" opacity="0.8"/>
            <circle cx="14" cy="84" r="3.5" fill="#FFFFFF" opacity="0.7"/>
            <circle cx="348" cy="24" r="5" fill="#FFF9C4" opacity="0.9"/>
            <circle cx="408" cy="336" r="3.5" fill="#FFFFFF" opacity="0.8"/>
            <path d="M92,132 L96,150 L114,154 L96,158 L92,176 L88,158 L70,154 L88,150 Z" fill="#FFFFFF" opacity="0.95"/>

            <!-- Outer Cyan Glow -->
            <circle cx="264" cy="236" r="190" fill="url(#circleGlow)"/>

            <!-- Main Glowing Button Ring -->
            <circle cx="264" cy="236" r="144" fill="url(#innerCircle)" stroke="#F0FDFF" stroke-width="16"/>
            <circle cx="264" cy="236" r="152" fill="none" stroke="#7CE8FF" stroke-width="4" opacity="0.8"/>

            <!-- Left Gear & Support -->
            <rect x="196" y="216" width="16" height="44" fill="#475569"/>
            <rect x="188" y="246" width="32" height="24" rx="2" fill="url(#orangeGrad)"/>
            <g transform="translate(212,194)">
              <circle r="24" fill="url(#orangeGrad)"/>
              <g fill="url(#orangeGrad)">
                <rect x="-5" y="-30" width="10" height="60" rx="2"/>
                <rect x="-30" y="-5" width="60" height="10" rx="2"/>
                <rect x="-5" y="-30" width="10" height="60" rx="2" transform="rotate(45)"/>
                <rect x="-30" y="-5" width="60" height="10" rx="2" transform="rotate(45)"/>
              </g>
              <circle r="13" fill="#E6F4FF"/>
              <circle r="8" fill="url(#orangeGrad)"/>
            </g>

            <!-- Right Gear & Support -->
            <rect x="331" y="192" width="7" height="64" fill="#475569"/>
            <rect x="320" y="248" width="28" height="22" rx="2" fill="url(#orangeGrad)"/>
            <g transform="translate(324,174)">
              <circle r="21" fill="url(#orangeGrad)"/>
              <g fill="url(#orangeGrad)">
                <rect x="-4" y="-26" width="8" height="52" rx="2"/>
                <rect x="-26" y="-4" width="52" height="8" rx="2"/>
                <rect x="-4" y="-26" width="8" height="52" rx="2" transform="rotate(45)"/>
                <rect x="-26" y="-4" width="52" height="8" rx="2" transform="rotate(45)"/>
              </g>
              <circle r="11" fill="#E6F4FF"/>
              <circle r="6" fill="url(#orangeGrad)"/>
            </g>

            <!-- Central Oil Derrick (Tower) -->
            <path d="M236,222 L252,124 L278,124 L294,222 Z" fill="none" stroke="#475569" stroke-width="8" stroke-linejoin="round"/>
            <line x1="248" y1="152" x2="282" y2="152" stroke="#475569" stroke-width="5"/>
            <line x1="243" y1="184" x2="287" y2="184" stroke="#475569" stroke-width="5"/>
            <line x1="250" y1="128" x2="286" y2="152" stroke="#475569" stroke-width="4"/>
            <line x1="280" y1="128" x2="244" y2="152" stroke="#475569" stroke-width="4"/>
            <line x1="246" y1="152" x2="289" y2="184" stroke="#475569" stroke-width="4"/>
            <line x1="284" y1="152" x2="241" y2="184" stroke="#475569" stroke-width="4"/>
            <line x1="242" y1="184" x2="293" y2="220" stroke="#475569" stroke-width="4"/>
            <line x1="288" y1="184" x2="237" y2="220" stroke="#475569" stroke-width="4"/>

            <!-- Derrick Top Orange Cap -->
            <circle cx="250" cy="100" r="5" fill="url(#orangeGrad)"/>
            <path d="M254,120 C254,104 276,104 276,120 Z" fill="url(#orangeGrad)"/>
            <rect x="238" y="118" width="54" height="11" rx="4" fill="url(#orangeGrad)"/>

            <!-- Derrick Lower Orange Platform & Legs -->
            <rect x="222" y="218" width="86" height="13" rx="3" fill="url(#orangeGrad)"/>
            <rect x="228" y="231" width="12" height="39" fill="url(#orangeGrad)"/>
            <rect x="290" y="231" width="12" height="39" fill="url(#orangeGrad)"/>
            <rect x="252" y="246" width="26" height="24" rx="3" fill="url(#orangeGrad)"/>

            <!-- Heavy Dark Base -->
            <rect x="180" y="268" width="176" height="16" rx="2" fill="#3B4252"/>

            <!-- Small Oil Drop Inside Circle -->
            <g transform="translate(305,112) scale(0.52)">
              <path d="M0,-32 C12,-12 24,4 24,18 C24,31 13,42 0,42 C-13,42 -24,31 -24,18 C-24,4 -12,-12 0,-32 Z" fill="url(#oilDrop)"/>
              <path d="M-10,8 C-12,18 -8,28 -2,32" fill="none" stroke="#94A3B8" stroke-width="4" stroke-linecap="round"/>
            </g>

            <!-- Left Floating Oil Drop -->
            <g transform="translate(112,106) scale(0.88)">
              <path d="M0,-34 C14,-12 26,6 26,20 C26,34 14,46 0,46 C-14,46 -26,34 -26,20 C-26,6 -14,-12 0,-34 Z" fill="url(#oilDrop)"/>
              <path d="M-12,6 C-15,18 -10,30 -2,35" fill="none" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>
              <circle cx="10" cy="24" r="3" fill="#CBD5E1" opacity="0.6"/>
            </g>

            <!-- Top-Right Floating Oil Drop -->
            <g transform="translate(392,44) rotate(12) scale(1.12)">
              <path d="M0,-34 C14,-12 26,6 26,20 C26,34 14,46 0,46 C-14,46 -26,34 -26,20 C-26,6 -14,-12 0,-34 Z" fill="url(#oilDrop)"/>
              <path d="M-12,6 C-15,18 -10,30 -2,35" fill="none" stroke="#94A3B8" stroke-width="4.5" stroke-linecap="round"/>
              <circle cx="9" cy="22" r="3.5" fill="#FFFFFF" opacity="0.8"/>
            </g>

            <!-- Gold Ruble Coin at Top -->
            <g transform="translate(272,48)">
              <circle r="38" fill="url(#goldCoin)" stroke="#F59E0B" stroke-width="3"/>
              <circle r="29" fill="#FBBF24" stroke="#D97706" stroke-width="2.5"/>
              <path d="M-8,-16 L4,-16 C12,-16 17,-11 17,-5 C17,1 12,6 4,6 L-8,6 M-8,-16 L-8,18 M-14,5 L6,5 M-14,12 L6,12"
                    fill="none" stroke="#FFFBEB" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
            </g>

            <!-- White Clicking Hand (Foreground) -->
            <circle cx="246" cy="285" r="45" fill="#FFFFFF" opacity="0.45"/>
            <path d="M36,512 L44,442 C46,412 82,402 96,424 C98,386 138,376 154,400 C158,364 198,358 212,384 L224,284 C228,248 278,252 276,290 L264,424 C298,426 352,456 346,512 Z"
                  fill="#CBE0F5"/>
            <path d="M28,512 L36,446 C38,418 74,408 88,430 C90,392 130,382 146,406 C150,370 190,364 204,390 L218,282 C222,248 268,252 266,288 L252,432 C286,434 338,462 332,512 Z"
                  fill="#FFFFFF"/>
          </svg>
          EOF

          python3 - << 'PYEOF'
          import os, subprocess
          from PIL import Image, ImageDraw

          user_icon = None
          for candidate in ["icon.png", "icon.jpg", "icon.jpeg"]:
              if os.path.exists(candidate):
                  user_icon = candidate
                  print(f"Using user uploaded icon: {user_icon}")
                  break

          if user_icon:
              base_img = Image.open(user_icon).convert("RGBA")
          else:
              subprocess.run(["rsvg-convert", "-w", "512", "-h", "512", "icon_generated.svg", "-o", "icon_rendered.png"], check=True)
              base_img = Image.open("icon_rendered.png").convert("RGBA")

          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192
          }

          for folder, size in sizes.items():
              out_dir = f"app/src/main/res/{folder}"
              resized = base_img.resize((size, size), Image.Resampling.LANCZOS)

              # Square icon with rounded corners
              mask_sq = Image.new("L", (size, size), 0)
              draw_sq = ImageDraw.Draw(mask_sq)
              radius = int(size * 0.20)
              draw_sq.rounded_rectangle((0, 0, size, size), radius=radius, fill=255)
              sq_icon = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              sq_icon.paste(resized, (0, 0), mask_sq)
              sq_icon.save(f"{out_dir}/ic_launcher.png", "PNG")

              # Circular icon
              mask_rnd = Image.new("L", (size, size), 0)
              draw_rnd = ImageDraw.Draw(mask_rnd)
              draw_rnd.ellipse((0, 0, size, size), fill=255)
              rnd_icon = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              rnd_icon.paste(resized, (0, 0), mask_rnd)
              rnd_icon.save(f"{out_dir}/ic_launcher_round.png", "PNG")
          PYEOF

      - name: Create Gradle Configuration Files
        run: |
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OilTycoon"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.5.2'
              }
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Create Keystore for RuStore Signing
        run: |
          keytool -genkey -v -keystore release-key.jks \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -alias oilkey \
            -storepass OilPass123 \
            -keypass OilPass123 \
            -dname "CN=OilTycoon, OU=Games, O=OilMagnate, L=Moscow, S=Moscow, C=RU"

      - name: Create AndroidManifest.xml (Кликер нефтяной магнат)
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="com.google.android.gms.permission.AD_ID" />

              <application
                  android:allowBackup="true"
                  android:label="Кликер нефтяной магнат"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar"
                  tools:targetApi="34">

                  <meta-data
                      android:name="com.yandex.mobile.ads.APPLICATION_ID"
                      android:value="20330347" />

                  <activity
                      android:name=".MainActivity"
                      android:label="Кликер нефтяной магнат"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Create MainActivity.java with All 13 Yandex Ad Blocks
        run: |
          cat << 'EOF' > app/src/main/java/com/oiltycoon/magnate/MainActivity.java
          package com.oiltycoon.magnate;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          import com.yandex.mobile.ads.common.AdError;
          import com.yandex.mobile.ads.common.AdRequestConfiguration;
          import com.yandex.mobile.ads.common.AdRequestError;
          import com.yandex.mobile.ads.common.ImpressionData;
          import com.yandex.mobile.ads.common.MobileAds;
          import com.yandex.mobile.ads.interstitial.InterstitialAd;
          import com.yandex.mobile.ads.interstitial.InterstitialAdEventListener;
          import com.yandex.mobile.ads.interstitial.InterstitialAdLoadListener;
          import com.yandex.mobile.ads.interstitial.InterstitialAdLoader;
          import com.yandex.mobile.ads.rewarded.Reward;
          import com.yandex.mobile.ads.rewarded.RewardedAd;
          import com.yandex.mobile.ads.rewarded.RewardedAdEventListener;
          import com.yandex.mobile.ads.rewarded.RewardedAdLoadListener;
          import com.yandex.mobile.ads.rewarded.RewardedAdLoader;
          import com.yandex.mobile.ads.appopenad.AppOpenAd;
          import com.yandex.mobile.ads.appopenad.AppOpenAdEventListener;
          import com.yandex.mobile.ads.appopenad.AppOpenAdLoadListener;
          import com.yandex.mobile.ads.appopenad.AppOpenAdLoader;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;

              // 8 Rewarded Ad Blocks (R-M-20330347-1 to 8)
              private final String[] rewardedIds = {
                  "R-M-20330347-1", "R-M-20330347-2", "R-M-20330347-3", "R-M-20330347-4",
                  "R-M-20330347-5", "R-M-20330347-6", "R-M-20330347-7", "R-M-20330347-8"
              };

              // 4 Interstitial Ad Blocks (R-M-20330347-9 to 12)
              private final String[] interstitialIds = {
                  "R-M-20330347-9", "R-M-20330347-10", "R-M-20330347-11", "R-M-20330347-12"
              };
              private int currentInterstitialIndex = 0;

              // 1 App Open Ad Block (R-M-20330347-13)
              private final String appOpenId = "R-M-20330347-13";

              private RewardedAdLoader rewardedAdLoader;
              private InterstitialAdLoader interstitialAdLoader;
              private AppOpenAdLoader appOpenAdLoader;

              private int currentRewardIndex = 0;
              private int retryCount = 0;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  setContentView(webView);

                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient());
                  webView.addJavascriptInterface(new WebAppInterface(), "Android");

                  MobileAds.initialize(this, () -> {});

                  rewardedAdLoader = new RewardedAdLoader(this);
                  interstitialAdLoader = new InterstitialAdLoader(this);
                  appOpenAdLoader = new AppOpenAdLoader(this);

                  loadAndShowAppOpenAd();

                  webView.loadUrl("file:///android_asset/index.html");
              }

              private void loadAndShowAppOpenAd() {
                  appOpenAdLoader.setAdLoadListener(new AppOpenAdLoadListener() {
                      @Override
                      public void onAdLoaded(final AppOpenAd appOpenAd) {
                          appOpenAd.setAdEventListener(new AppOpenAdEventListener() {
                              @Override public void onAdShown() {}
                              @Override public void onAdFailedToShow(final AdError adError) {}
                              @Override public void onAdDismissed() {}
                              @Override public void onAdClicked() {}
                              @Override public void onAdImpression(final ImpressionData impressionData) {}
                          });
                          appOpenAd.show(MainActivity.this);
                      }
                      @Override
                      public void onAdFailedToLoad(final AdRequestError adRequestError) {}
                  });
                  appOpenAdLoader.loadAd(new AdRequestConfiguration.Builder(appOpenId).build());
              }

              private void loadRewardedBlock(final int blockIdx) {
                  final String unitId = rewardedIds[blockIdx % rewardedIds.length];
                  rewardedAdLoader.setAdLoadListener(new RewardedAdLoadListener() {
                      @Override
                      public void onAdLoaded(final RewardedAd rewardedAd) {
                          retryCount = 0;
                          rewardedAd.setAdEventListener(new RewardedAdEventListener() {
                              @Override public void onAdShown() {}
                              @Override
                              public void onAdFailedToShow(final AdError adError) {
                                  evalJs("window.onAndroidAdFailed && window.onAndroidAdFailed('Ошибка показа');");
                              }
                              @Override
                              public void onAdDismissed() {
                                  evalJs("window.onAndroidAdClosed && window.onAndroidAdClosed();");
                              }
                              @Override public void onAdClicked() {}
                              @Override public void onAdImpression(final ImpressionData data) {}
                              @Override
                              public void onRewarded(final Reward reward) {
                                  evalJs("window.onAndroidAdRewarded && window.onAndroidAdRewarded(" + currentRewardIndex + ");");
                              }
                          });
                          rewardedAd.show(MainActivity.this);
                      }

                      @Override
                      public void onAdFailedToLoad(final AdRequestError error) {
                          if (retryCount < 2) {
                              retryCount++;
                              loadRewardedBlock((currentRewardIndex + retryCount) % rewardedIds.length);
                          } else {
                              retryCount = 0;
                              evalJs("window.onAndroidAdFailed && window.onAndroidAdFailed('" + error.getDescription() + "');");
                          }
                      }
                  });
                  rewardedAdLoader.loadAd(new AdRequestConfiguration.Builder(unitId).build());
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public void showRewarded(final int index) {
                      runOnUiThread(() -> {
                          currentRewardIndex = Math.max(0, Math.min(index, rewardedIds.length - 1));
                          retryCount = 0;
                          loadRewardedBlock(currentRewardIndex);
                      });
                  }

                  @JavascriptInterface
                  public void showInterstitial() {
                      runOnUiThread(() -> {
                          final String unitId = interstitialIds[currentInterstitialIndex];
                          currentInterstitialIndex = (currentInterstitialIndex + 1) % interstitialIds.length;

                          interstitialAdLoader.setAdLoadListener(new InterstitialAdLoadListener() {
                              @Override
                              public void onAdLoaded(final InterstitialAd interstitialAd) {
                                  interstitialAd.setAdEventListener(new InterstitialAdEventListener() {
                                      @Override public void onAdShown() {}
                                      @Override public void onAdFailedToShow(final AdError adError) {}
                                      @Override public void onAdDismissed() {}
                                      @Override public void onAdClicked() {}
                                      @Override public void onAdImpression(final ImpressionData data) {}
                                  });
                                  interstitialAd.show(MainActivity.this);
                              }
                              @Override
                              public void onAdFailedToLoad(final AdRequestError error) {}
                          });
                          interstitialAdLoader.loadAd(new AdRequestConfiguration.Builder(unitId).build());
                      });
                  }
              }

              private void evalJs(final String script) {
                  runOnUiThread(() -> webView.evaluateJavascript(script, null));
              }

              @Override
              public void onBackPressed() {
                  if (webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Configure Build & Assemble Signed Release APK
        run: |
          write_build_gradle() {
            local SDK_VER=$1
            local COMPILE_SDK=$2
            local KOTLIN_VER=$3
            cat << EOF > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.oiltycoon.magnate'
              compileSdk ${COMPILE_SDK}

              defaultConfig {
                  applicationId "com.oiltycoon.magnate"
                  minSdk 24
                  targetSdk ${COMPILE_SDK}
                  versionCode 3
                  versionName "2.2.0"
              }

              signingConfigs {
                  release {
                      storeFile file("../release-key.jks")
                      storePassword "OilPass123"
                      keyAlias "oilkey"
                      keyPassword "OilPass123"
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                      shrinkResources false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }

              lint {
                  checkReleaseBuilds false
                  abortOnError false
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:${KOTLIN_VER}'
              implementation 'com.yandex.android:mobileads:${SDK_VER}'
          }
          EOF
          }

          echo "Attempting build with Yandex Mobile Ads SDK 8.5.0..."
          write_build_gradle "8.5.0" "35" "2.0.21"
          if ! gradle assembleRelease --no-daemon; then
            echo "Fallback to stable verified Yandex Mobile Ads SDK 7.7.0..."
            write_build_gradle "7.7.0" "34" "1.9.22"
            gradle clean assembleRelease --no-daemon
          fi

      - name: Upload Signed APK and Keystore
        uses: actions/upload-artifact@v4
        with:
          name: OilTycoon-v2.2-RuStore
          path: |
            app/build/outputs/apk/release/app-release.apk
            release-key.jks