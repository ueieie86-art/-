name: Build Signed APK for RuStore

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Android Project & Yandex SDK Code
        run: |
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/oiltycoon/magnate
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/values

          cp index.html app/src/main/assets/index.html

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "OilTycoon"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
          }
          EOF

          # Создаем ключ подписи для RuStore
          keytool -genkey -v -keystore release-key.jks -keyalg RSA -keysize 2048 -validity 10000 \
            -alias oilkey -storepass OilPass123 -keypass OilPass123 \
            -dname "CN=OilTycoon, OU=Games, O=OilMagnate, L=Moscow, S=Moscow, C=RU"

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.oiltycoon.magnate'
              compileSdk 34

              defaultConfig {
                  applicationId "com.oiltycoon.magnate"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              signingConfigs {
                  release {
                      storeFile file("../release-key.jks")
                      storePassword "OilPass123"
                      keyAlias "oilkey"
                      keyPassword "OilPass123"
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }

              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.yandex.android:mobileads:7.7.0'
          }
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          # Иконка приложения
          cat << 'EOF' > app/src/main/res/drawable/ic_launcher.xml
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#2C3E50" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#F39C12" android:pathData="M54,20 C54,20 30,52 30,70 C30,83.2 40.8,94 54,94 C67.2,94 78,83.2 78,70 C78,52 54,20 54,20 Z"/>
          </vector>
          EOF

          cat << 'EOF' > app/src/main/res/values/themes.xml
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.NoActionBar">
                  <item name="android:statusBarColor">#1A252F</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="com.google.android.gms.permission.AD_ID"/>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_launcher"
                  android:label="Нефтяной Магнат"
                  android:theme="@style/AppTheme"
                  android:hardwareAccelerated="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/oiltycoon/magnate/MainActivity.java
          package com.oiltycoon.magnate;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import androidx.annotation.NonNull;
          import androidx.annotation.Nullable;
          import androidx.appcompat.app.AppCompatActivity;

          import com.yandex.mobile.ads.appopenad.AppOpenAd;
          import com.yandex.mobile.ads.appopenad.AppOpenAdLoadListener;
          import com.yandex.mobile.ads.appopenad.AppOpenAdLoader;
          import com.yandex.mobile.ads.common.AdError;
          import com.yandex.mobile.ads.common.AdRequestConfiguration;
          import com.yandex.mobile.ads.common.AdRequestError;
          import com.yandex.mobile.ads.common.ImpressionData;
          import com.yandex.mobile.ads.common.MobileAds;
          import com.yandex.mobile.ads.interstitial.InterstitialAd;
          import com.yandex.mobile.ads.interstitial.InterstitialAdLoadListener;
          import com.yandex.mobile.ads.interstitial.InterstitialAdLoader;
          import com.yandex.mobile.ads.rewarded.Reward;
          import com.yandex.mobile.ads.rewarded.RewardedAd;
          import com.yandex.mobile.ads.rewarded.RewardedAdEventListener;
          import com.yandex.mobile.ads.rewarded.RewardedAdLoadListener;
          import com.yandex.mobile.ads.rewarded.RewardedAdLoader;

          public class MainActivity extends AppCompatActivity {

              private WebView webView;

              private final String appOpenId = "R-M-20330347-13";
              private final String[] interstitialIds = {
                  "R-M-20330347-9", "R-M-20330347-10", "R-M-20330347-11", "R-M-20330347-12"
              };
              private final String[] rewardedIds = {
                  "R-M-20330347-1", "R-M-20330347-2", "R-M-20330347-3", "R-M-20330347-4",
                  "R-M-20330347-5", "R-M-20330347-6", "R-M-20330347-7", "R-M-20330347-8"
              };

              private int interIndex = 0;
              private InterstitialAd interstitialAd;
              private InterstitialAdLoader interstitialLoader;
              private RewardedAdLoader rewardedLoader;
              private int currentRewardIndex = 0;

              @SuppressLint("SetJavaScriptEnabled")
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webView = new WebView(this);
                  webView.getSettings().setJavaScriptEnabled(true);
                  webView.getSettings().setDomStorageEnabled(true);
                  webView.addJavascriptInterface(new WebAppInterface(), "Android");
                  setContentView(webView);

                  webView.loadUrl("file:///android_asset/index.html");

                  MobileAds.initialize(this, () -> {
                      runOnUiThread(() -> {
                          loadAndShowAppOpenAd();
                          setupInterstitial();
                          setupRewarded();
                      });
                  });
              }

              public class WebAppInterface {
                  @JavascriptInterface
                  public void showInterstitial() {
                      runOnUiThread(() -> {
                          if (interstitialAd != null) {
                              interstitialAd.show(MainActivity.this);
                              interstitialAd = null;
                          }
                          loadNextInterstitial();
                      });
                  }

                  @JavascriptInterface
                  public void showRewarded(int index) {
                      runOnUiThread(() -> {
                          currentRewardIndex = index;
                          if (index < 0 || index >= rewardedIds.length) currentRewardIndex = 0;
                          String unitId = rewardedIds[currentRewardIndex];
                          if (rewardedLoader != null) {
                              rewardedLoader.loadAd(new AdRequestConfiguration.Builder(unitId).build());
                          }
                      });
                  }
              }

              private void loadAndShowAppOpenAd() {
                  AppOpenAdLoader loader = new AppOpenAdLoader(this);
                  loader.setAdLoadListener(new AppOpenAdLoadListener() {
                      @Override
                      public void onAdLoaded(@NonNull AppOpenAd ad) {
                          ad.show(MainActivity.this);
                      }
                      @Override
                      public void onAdFailedToLoad(@NonNull AdRequestError error) {}
                  });
                  loader.loadAd(new AdRequestConfiguration.Builder(appOpenId).build());
              }

              private void setupInterstitial() {
                  interstitialLoader = new InterstitialAdLoader(this);
                  interstitialLoader.setAdLoadListener(new InterstitialAdLoadListener() {
                      @Override
                      public void onAdLoaded(@NonNull InterstitialAd ad) {
                          interstitialAd = ad;
                      }
                      @Override
                      public void onAdFailedToLoad(@NonNull AdRequestError error) {}
                  });
                  loadNextInterstitial();
              }

              private void loadNextInterstitial() {
                  String id = interstitialIds[interIndex];
                  interIndex = (interIndex + 1) % interstitialIds.length;
                  if (interstitialLoader != null) {
                      interstitialLoader.loadAd(new AdRequestConfiguration.Builder(id).build());
                  }
              }

              private void setupRewarded() {
                  rewardedLoader = new RewardedAdLoader(this);
                  rewardedLoader.setAdLoadListener(new RewardedAdLoadListener() {
                      @Override
                      public void onAdLoaded(@NonNull RewardedAd ad) {
                          webView.evaluateJavascript("closeModal();", null);
                          ad.setAdEventListener(new RewardedAdEventListener() {
                              @Override
                              public void onAdShown() {}
                              @Override
                              public void onAdFailedToShow(@NonNull AdError adError) {}
                              @Override
                              public void onAdDismissed() {}
                              @Override
                              public void onAdClicked() {}
                              @Override
                              public void onAdImpression(@Nullable ImpressionData data) {}
                              @Override
                              public void onRewarded(@NonNull Reward reward) {
                                  runOnUiThread(() -> {
                                      webView.evaluateJavascript("giveReward(" + currentRewardIndex + ");", null);
                                  });
                              }
                          });
                          ad.show(MainActivity.this);
                      }

                      @Override
                      public void onAdFailedToLoad(@NonNull AdRequestError error) {
                          runOnUiThread(() -> {
                              webView.evaluateJavascript("onAdFailed('" + error.getDescription() + "');", null);
                          });
                      }
                  });
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Build Signed Release APK
        run: gradle assembleRelease --no-daemon

      - name: Upload Signed APK and Keystore
        uses: actions/upload-artifact@v4
        with:
          name: OilTycoon-RuStore-Ready
          path: |
            app/build/outputs/apk/release/app-release.apk
            release-key.jks
